<style>
:root{
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --surface-3:#2f2f2c;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
  --neg:#e66767; --neg-soft:rgba(230,103,103,.16);
  --line:rgba(255,255,255,.10);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  display:flex;flex-direction:column;
}
input,textarea,select{font:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#app{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top)}
.pantalla{flex:1;display:none;flex-direction:column;min-height:0}
.pantalla.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px}
.titulo{padding:14px 16px 8px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.titulo.enScroll{padding-left:0;padding-right:0}

/* ---------- cargar ---------- */
.monto{flex:0 0 auto;padding:14px 16px 8px;text-align:center}
.monto .cifra{font-size:44px;font-weight:650;letter-spacing:-.02em;line-height:54px;height:54px;
  white-space:nowrap;overflow:hidden}
.monto .cifra.cero{color:var(--surface-3)}
.monto .cifra.mas{color:var(--accent)}
.monto .sub{margin-top:2px;font-size:12.5px;color:var(--muted);height:17px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opciones{flex:0 0 auto;display:flex;gap:7px;padding:0 16px 9px;overflow-x:auto;scrollbar-width:none}
.opciones::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--surface-2);
  color:var(--ink-2);font-size:13.5px;white-space:nowrap;border:1px solid transparent}
.chip.activo{background:var(--accent-soft);color:#9cc6f5;border-color:rgba(57,135,229,.4)}
#desc{flex:1 1 120px;min-width:120px;background:var(--surface-2);border:1px solid transparent;
  border-radius:999px;padding:7px 12px;color:var(--ink);font-size:15px;outline:none}
#desc::placeholder{color:var(--muted)}
#desc:focus{border-color:var(--accent)}

.cats{flex:1;min-height:0;overflow-y:auto;padding:2px 16px 8px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-content:start}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;color:var(--ink-2);line-height:1.15;text-align:center;min-height:56px;
  justify-content:center;transition:transform .08s,background .12s}
.cat:active{transform:scale(.95);background:var(--surface-2)}
.cat .e{font-size:19px;line-height:1}
.cat.sug{border-color:var(--accent);background:var(--accent-soft);color:#9cc6f5}
.verTodas{grid-column:1/-1;padding:9px;text-align:center;font-size:13px;color:var(--muted)}

.teclado{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:7px 16px 5px;background:var(--bg)}
.tecla{background:var(--surface-2);border-radius:12px;height:46px;font-size:22px;font-weight:520;
  display:flex;align-items:center;justify-content:center;transition:background .1s}
.tecla:active{background:var(--surface-3)}
.tecla.aux{font-size:18px;color:var(--ink-2)}

/* ---------- tabs ---------- */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;color:var(--muted)}
.tab .i{font-size:18px;line-height:1}
.tab.on{color:var(--accent)}

/* ---------- listas ---------- */
.dia{padding:15px 0 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.item .e{font-size:19px;flex:0 0 auto}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .t1{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .m.mas{color:var(--accent)}

/* ---------- mes ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:6px 0 9px;text-align:center}
.hero .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.hero .val{font-size:38px;font-weight:650;letter-spacing:-.025em;margin:5px 0 2px;white-space:nowrap}
.hero .val.mas{color:var(--accent)} .hero .val.menos{color:var(--neg)}
.hero .pie{font-size:12.5px;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:4px}
.tiles+.tiles{margin-top:8px}
/* tres columnas para el reparto del gasto: entran justas en un iPhone chico */
.tiles.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.tres .lab{font-size:9.5px;letter-spacing:.03em}
.tiles.tres .val{font-size:16.5px;margin-top:3px}
.tiles.tres .pie{font-size:11px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;min-width:0;overflow:hidden}
.tile .lab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
  font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font-size:19px;font-weight:650;letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
.tile .val.mas{color:var(--accent)} .tile .val.menos{color:var(--neg)}
.tile .pie{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* barras horizontales, una sola serie: un solo color por diseño */
.barra{margin-bottom:11px}
.barra .fila{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.barra .nom{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .val{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.barra .pct{color:var(--muted);font-size:11.5px;margin-left:5px}
.pista{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.rell{height:100%;background:var(--accent);border-radius:4px;transition:width .35s ease}

/* ahorro mes a mes: polaridad, azul arriba / rojo abajo del cero */
.evo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 12px 8px;margin-bottom:4px}
.evoGraf{display:flex;align-items:stretch;gap:3px;height:112px;position:relative}
.evoMes{flex:1;display:flex;flex-direction:column;min-width:0}
.evoArriba,.evoAbajo{flex:1;display:flex}
.evoArriba{align-items:flex-end}
.evoBar{width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.evoAbajo .evoBar{border-radius:0 0 4px 4px;background:var(--neg)}
.evoCero{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.evoEjes{display:flex;gap:3px;margin-top:5px}
.evoEje{flex:1;text-align:center;font-size:9.5px;color:var(--muted);min-width:0;overflow:hidden}
.evoEje.hoy{color:var(--accent);font-weight:700}
.evoPie{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);
  margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
.evoPie span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.persona{display:flex;align-items:center;gap:11px;padding:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;margin-bottom:7px}
.persona .e{font-size:22px}
.persona .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.persona .n{display:block;font-size:15px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona .v{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona .s{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.persona .s.menos{color:var(--neg)} .persona .s.mas{color:var(--accent)}

/* ---------- formularios ---------- */
.campo{margin-bottom:12px}
.campo label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.campo input,.campo select,.campo textarea{width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--ink);
  outline:none;font-size:16px}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--accent)}
.campo textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px;resize:vertical}
.btn{width:100%;background:var(--accent);color:#fff;border-radius:12px;padding:13px;
  font-weight:600;font-size:15.5px;text-align:center}
.btn:active{opacity:.85}
.btn.sec{background:var(--surface-2);color:var(--ink-2)}
.btn.peligro{background:transparent;color:var(--neg);border:1px solid rgba(230,103,103,.35)}
.nota{font-size:12.5px;color:var(--muted);line-height:1.5;margin:8px 0 16px}
.vacio{text-align:center;color:var(--muted);padding:44px 24px;font-size:14.5px;line-height:1.6}

.velo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.velo.on{display:block}
/* Sin padding arriba a propósito: el relleno lo pone .sheetTop, que va pegado
   al borde. Si el padding vive acá, la barra sticky se corre 8px y le come el
   título al contenido. */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-radius:20px 20px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .24s ease,visibility .24s;
  max-height:88vh;overflow-y:auto;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.asa{width:38px;height:4px;background:var(--surface-3);border-radius:2px;margin:6px auto 14px}
.sheet h3{margin:0 0 14px;font-size:17px;padding-right:40px}
/* Barra de agarre: fija arriba para que la ✕ esté siempre a mano aunque
   estés scrolleando una lista larga, como la del lector. */
.sheetTop{position:sticky;top:0;z-index:2;background:var(--surface);
  margin:0 -16px;padding:8px 16px 2px}
.cerrar{position:absolute;top:6px;right:12px;width:34px;height:34px;border-radius:50%;
  background:var(--surface-2);color:var(--ink-2);font-size:19px;line-height:34px;
  text-align:center;z-index:3}
.cerrar:active{background:var(--surface-3)}
.sheet.arrastrando{transition:none}
.toast{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:60;
  background:var(--surface-3);border:1px solid var(--line);border-radius:13px;padding:11px 14px;
  display:flex;align-items:center;gap:10px;transform:translateY(140%);
  transition:transform .24s ease,visibility .24s;box-shadow:0 8px 28px rgba(0,0,0,.5);visibility:hidden}
.toast.on{transform:none;visibility:visible}
.toast .t{flex:1;font-size:13.5px;min-width:0}
.toast button{color:var(--accent);font-weight:600;font-size:14px;padding:4px 2px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--surface-2);
  font-size:11px;color:var(--muted);margin-left:6px}
.mini{flex:0 0 auto;padding:6px 10px;border-radius:9px;background:var(--surface-2);
  color:var(--ink-2);font-size:12.5px}
.mini.peligro{color:var(--neg);background:rgba(230,103,103,.12)}
.selMini{margin-top:6px;width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:7px 8px;color:var(--ink);font-size:14px}
.err{color:var(--neg);font-size:13px;margin-top:8px}
.ok{color:var(--accent);font-size:13px;margin-top:8px}
table.prev{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
table.prev th,table.prev td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
table.prev th{color:var(--muted);font-weight:600}
</style>
</head>
<body>

<div id="app">

  <section class="pantalla on" id="p-cargar">
    <div class="monto">
      <div class="cifra cero" id="cifra">$ 0</div>
      <div class="sub" id="subCarga">Tocá una categoría para guardar</div>
    </div>
    <div class="opciones">
      <button class="chip" id="chSigno">Gasto</button>
      <button class="chip" id="chFecha">Hoy</button>
      <button class="chip" id="chMedio">Medio</button>
      <button class="chip" id="chMoneda">$</button>
      <input id="desc" placeholder="Detalle (opcional)" autocomplete="off" autocorrect="off">
    </div>
    <div class="cats" id="cats"></div>
    <div class="teclado" id="teclado"></div>
  </section>

  <section class="pantalla" id="p-ultimos">
    <div class="titulo">Últimos movimientos</div>
    <div class="scroll" id="lista"></div>
  </section>

  <section class="pantalla" id="p-mes">
    <div class="titulo" id="tituloMes">Este mes</div>
    <div class="scroll" id="mes"></div>
  </section>

  <section class="pantalla" id="p-mas">
    <div class="titulo">Ajustes</div>
    <div class="scroll" id="mas"></div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-p="cargar"><span class="i">✚</span>Cargar</button>
    <button class="tab" data-p="ultimos"><span class="i">☰</span>Últimos</button>
    <button class="tab" data-p="mes"><span class="i">▤</span>Mes</button>
    <button class="tab" data-p="mas"><span class="i">⚙</span>Más</button>
  </nav>
</div>

<div class="velo" id="velo"></div>
<div class="sheet" id="sheet">
  <div class="sheetTop" id="sheetTop"><div class="asa"></div>
    <button class="cerrar" id="btnCerrarSheet" aria-label="Cerrar">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast"><div class="t" id="toastTxt"></div><button id="toastBtn"></button></div>

<script>
/* ---- resumen.js incrustado, para que sea un solo archivo ---- */
/**
 * resumen.js — Lector de resúmenes de tarjeta (BBVA / Visa, formato argentino).
 *
 * Corre en el teléfono: el PDF nunca sale de ahí. A la planilla viajan
 * solamente las líneas ya extraídas.
 *
 * Saca del PDF:
 *   · cierre y vencimiento (actual y próximo) — el resumen los dice, no se adivinan
 *   · cada consumo, con titular, fecha, comercio, importe y moneda
 *   · las cuotas (C.04/06), con número y total del plan
 *   · impuestos y percepciones
 *   · la proyección de las cuotas que faltan, con comercio y monto
 *
 * Se expone como window.LectorResumen.
 */
(function (global) {
  'use strict';

  var MESES_CORTOS = {
    ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5,
    jul: 6, ago: 7, sep: 8, set: 8, oct: 9, nov: 10, dic: 11
  };
  var MESES_LARGOS = {
    enero: 0, febrero: 1, marzo: 2, abril: 3, mayo: 4, junio: 5, julio: 6,
    agosto: 7, setiembre: 8, septiembre: 8, octubre: 9, noviembre: 10, diciembre: 11
  };

  function sinAcentos(s) {
    return String(s)
      .replace(/[áÁ]/g, 'a').replace(/[éÉ]/g, 'e').replace(/[íÍ]/g, 'i')
      .replace(/[óÓ]/g, 'o').replace(/[úÚ]/g, 'u').replace(/[üÜ]/g, 'u');
  }

  /** '30-Jul-26' -> Date */
  function fechaCorta(s) {
    var m = String(s).trim().match(/^(\d{1,2})-([A-Za-zé]{3})-(\d{2,4})$/);
    if (!m) return null;
    var mes = MESES_CORTOS[sinAcentos(m[2]).toLowerCase()];
    if (mes === undefined) return null;
    var anio = parseInt(m[3], 10);
    if (anio < 100) anio += 2000;
    var d = new Date(anio, mes, parseInt(m[1], 10), 12, 0, 0, 0);
    return isNaN(d.getTime()) ? null : d;
  }

  /** '34.150,00' -> 34150 ; '-327.243,07' -> -327243.07 */
  function aNumero(s) {
    var t = String(s).trim().replace(/\$/g, '').replace(/\s/g, '');
    if (!/^-?[\d.]+,\d{2}$|^-?[\d.]+$/.test(t)) return null;
    var neg = t.charAt(0) === '-';
    t = t.replace(/^-/, '').replace(/\./g, '').replace(/,/g, '.');
    var v = parseFloat(t);
    if (isNaN(v)) return null;
    return neg ? -v : v;
  }

  function iso(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) +
           '-' + ('0' + d.getDate()).slice(-2);
  }

  function sumarMeses(f, n) {
    var dia = f.getDate();
    var x = new Date(f.getFullYear(), f.getMonth() + n, 1, 12, 0, 0, 0);
    var ultimo = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
    x.setDate(Math.min(dia, ultimo));
    return x;
  }

  /**
   * Agrupa los fragmentos de texto en renglones.
   *
   * No sirve redondear la coordenada vertical: el importe de una fila suele
   * caer medio punto más abajo que el comercio (214,80 contra 215,23) y al
   * redondear terminan en renglones distintos — la fila pierde el comercio o
   * pierde el monto. Se agrupa por cercanía.
   */
  function renglones(items, tol) {
    tol = tol || 3.5;
    var ws = items.map(function (it) {
      var t = it.transform;
      return { texto: it.str, x0: t[4], x1: t[4] + (it.width || 0), top: -t[5] };
    }).filter(function (w) { return w.texto && w.texto.trim(); });

    ws.sort(function (a, b) { return a.top - b.top || a.x0 - b.x0; });

    var salida = [], actual = [], base = null;
    ws.forEach(function (w) {
      if (base === null || Math.abs(w.top - base) <= tol) {
        if (base === null) base = w.top;
        actual.push(w);
      } else {
        salida.push(actual.sort(function (a, b) { return a.x0 - b.x0; }));
        actual = [w]; base = w.top;
      }
    });
    if (actual.length) salida.push(actual.sort(function (a, b) { return a.x0 - b.x0; }));
    return salida;
  }

  function texto(ws) {
    return ws.map(function (w) { return w.texto; }).join(' ').replace(/\s+/g, ' ').trim();
  }

  /** Sin espacios ni acentos: para buscar rótulos que pdf.js parte al medio. */
  function compacto(t) {
    return sinAcentos(t).replace(/\s+/g, '').toUpperCase();
  }

  // ------------------------------------------------------------- cabecera

  function leerCabecera(L, r) {
    var plano = L.join('\n');
    var RE_FECHA = /\d{1,2}-[A-Za-zé]{3}-\d{2}/g;

    function ventana(i, n) {
      return L.slice(Math.max(0, i - 1), i + (n || 4) + 1);
    }
    function fechasCerca(i, cuantas) {
      var v = ventana(i);
      for (var k = 0; k < v.length; k++) {
        var f = v[k].match(RE_FECHA);
        if (f && f.length >= cuantas) return f;
      }
      return null;
    }

    var mT = plano.match(/(Visa [A-Za-zÁ-ú]+)/);
    var mC = plano.match(/cuenta\s+(\d{6,})/);
    if (mT) r.tarjeta = { nombre: mT[1], cuenta: mC ? mC[1] : null };

    var mTit = plano.match(/^([A-ZÑÁÉÍÓÚ]+ [A-ZÑÁÉÍÓÚ ]{6,})$/m);
    if (mTit) r.titular = mTit[1].trim();

    for (var i = 0; i < L.length; i++) {
      var t = L[i];

      if (!r.cierre && t.indexOf('CIERRE ACTUAL') >= 0 && t.indexOf('VENCIMIENTO ACTUAL') >= 0) {
        var f2 = fechasCerca(i, 2);
        if (f2) { r.cierre = fechaCorta(f2[0]); r.vencimiento = fechaCorta(f2[1]); }
      }

      // Sin espacios ni acentos: pdf.js parte "PRÓXIMO" en "PR" + "XIMO",
      // así que buscar el texto tal cual no encuentra nada.
      if (!r.proximoCierre && /PR.{0,2}XIMOCIERRE/.test(compacto(t))) {
        var f4 = fechasCerca(i, 4);
        if (f4) { r.proximoCierre = fechaCorta(f4[2]); r.proximoVencimiento = fechaCorta(f4[3]); }
      }

      if (!r.cuotasAVencer.length && /cuotas a vencer/i.test(t)) {
        var meses = null, importes = null;
        ventana(i, 3).forEach(function (t2) {
          if (!meses) {
            var mm = t2.match(/([A-ZÁ-Ú]{4,})\/(\d{2})/g);
            if (mm) meses = mm;
          }
          if (!importes && (t2.match(/\$/g) || []).length >= 2) {
            importes = (t2.match(/\$\s?[\d.,]+/g) || []).map(function (x) {
              return aNumero(x.replace('$', ''));
            });
          }
        });
        if (meses && importes) {
          for (var j = 0; j < Math.min(meses.length, importes.length); j++) {
            var p = meses[j].split('/');
            var mes = MESES_LARGOS[sinAcentos(p[0]).toLowerCase()];
            if (mes !== undefined) {
              r.cuotasAVencer.push({
                cierre: '20' + p[1] + '-' + ('0' + (mes + 1)).slice(-2),
                total: importes[j]
              });
            }
          }
        }
      }
    }
  }

  // ---------------------------------------------------------------- filas

  function leerFila(ws, fecha, seccion, persona, xPesos, xDolares, r) {
    // Solo cuentan como importe las palabras que caen en las columnas de plata.
    // Si no, un número metido en la descripción —"DB.RG 5617 30% ( 46839,76 )"—
    // se tomaría como el monto de la fila.
    var borde = xPesos ? xPesos - 65 : 0;
    var montos = [];
    for (var i = 1; i < ws.length; i++) {
      var w = ws[i];
      if (w.x1 < borde) continue;
      var v = aNumero(w.texto);
      if (v !== null && /[.,]/.test(w.texto)) montos.push({ w: w, v: v });
    }

    var pesos = null, dolares = null;
    montos.forEach(function (m) {
      var dP = xPesos ? Math.abs(m.w.x1 - xPesos) : 1e9;
      var dD = xDolares ? Math.abs(m.w.x1 - xDolares) : 1e9;
      if (dD < dP) dolares = m.v; else pesos = m.v;
    });

    var corte = 1e9;
    montos.forEach(function (m) { if (m.w.x0 < corte) corte = m.w.x0; });

    var descPartes = [], cupon = null;
    for (var j = 1; j < ws.length; j++) {
      var p = ws[j];
      if (p.x0 >= corte) continue;
      if (/^\d{6}$/.test(p.texto)) { cupon = p.texto; continue; }
      descPartes.push(p.texto);
    }
    var desc = descPartes.join(' ').replace(/\s+/g, ' ').trim();

    var cuota = null;
    var mc = desc.match(/C\.\s?(\d{1,2})\s*\/\s*(\d{1,2})/);
    if (mc) {
      cuota = { nro: parseInt(mc[1], 10), total: parseInt(mc[2], 10) };
      desc = (desc.slice(0, mc.index) + ' ' + desc.slice(mc.index + mc[0].length)).trim();
    }

    desc = desc.replace(/USD\s*[\d.,]*\s*$/i, '').replace(/\s+/g, ' ').replace(/^[-\s]+|[-\s]+$/g, '');
    if (!desc && !pesos && !dolares) return;

    r.movimientos.push({
      fecha: iso(fecha),
      seccion: seccion,
      titular: persona,
      descripcion: desc,
      cupon: cupon,
      pesos: pesos,
      dolares: dolares,
      cuota: cuota
    });
  }

  // ------------------------------------------------------------ proyección

  /**
   * Las cuotas que faltan, mes a mes, calculadas desde los C.NN/MM.
   * Se anclan al PRÓXIMO VENCIMIENTO, o sea al día en que la plata sale.
   * Ojo: el banco rotula su tabla por mes de CIERRE, que va un mes antes.
   */
  function proyectar(r) {
    var base = r.proximoVencimiento || (r.vencimiento && sumarMeses(r.vencimiento, 1));
    if (!base) return [];
    var acum = {};
    r.movimientos.forEach(function (m) {
      if (m.seccion !== 'consumos' || !m.cuota) return;
      var faltan = m.cuota.total - m.cuota.nro;
      if (faltan <= 0) return;
      var monto = m.pesos || 0;
      for (var i = 0; i < faltan; i++) {
        var f = sumarMeses(base, i);
        var k = iso(f).slice(0, 7);
        if (!acum[k]) acum[k] = { mes: k, fecha: iso(f), total: 0, detalle: [] };
        acum[k].total = Math.round((acum[k].total + monto) * 100) / 100;
        acum[k].detalle.push({
          comercio: m.descripcion, titular: m.titular, monto: monto,
          cuota: (m.cuota.nro + i + 1) + '/' + m.cuota.total
        });
      }
    });
    return Object.keys(acum).sort().map(function (k) { return acum[k]; });
  }

  /**
   * Compara mi proyección contra la tabla que imprime el banco.
   * Si cuadran, la lectura está bien. Si no, algo se leyó mal y hay que avisar
   * en vez de cargar números inventados.
   */
  function controlar(r) {
    var mio = {};
    r.proyeccion.forEach(function (p) { mio[p.mes] = p.total; });
    var filas = r.cuotasAVencer.map(function (c) {
      // el banco rotula por cierre; el pago cae al mes siguiente
      var p = c.cierre.split('-');
      var f = new Date(parseInt(p[0], 10), parseInt(p[1], 10), 1);
      var mesPago = f.getFullYear() + '-' + ('0' + (f.getMonth() + 1)).slice(-2);
      var calc = mio[mesPago] || 0;
      return {
        cierre: c.cierre, mesPago: mesPago, banco: c.total, calculado: calc,
        ok: Math.abs(c.total - calc) < 1
      };
    });
    return { filas: filas, ok: filas.every(function (f) { return f.ok; }) };
  }

  // ----------------------------------------------------------------- API

  function leerPaginas(paginas) {
    var r = {
      tarjeta: null, titular: null,
      cierre: null, vencimiento: null, proximoCierre: null, proximoVencimiento: null,
      movimientos: [], totalesDeclarados: [], cuotasAVencer: []
    };

    var todas = [];
    paginas.forEach(function (items) { todas = todas.concat(renglones(items)); });
    var L = todas.map(texto);
    leerCabecera(L, r);

    var seccion = null, persona = null, xPesos = null, xDolares = null;

    todas.forEach(function (ws) {
      var t = texto(ws);

      if (/^Sus pagos y ajustes/.test(t)) { seccion = 'pagos'; persona = null; return; }
      var mc = t.match(/^Consumos\s+(.+)$/);
      if (mc && t.toUpperCase().indexOf('DE ') < 0) {
        seccion = 'consumos'; persona = mc[1].trim(); return;
      }
      if (/^Impuestos, cargos/.test(t)) { seccion = 'impuestos'; persona = null; return; }
      if (/^Legales/.test(t) || /^SALDO ACTUAL/.test(t)) { seccion = null; return; }

      // Fila de encabezado: nos dice dónde caen las columnas de plata.
      //
      // No se puede buscar la palabra "DÓLARES": pdf.js corta los fragmentos
      // en los acentos y ese título llega partido como "D" + "LARES". Nos
      // guiamos por posición: PESOS marca su columna, y lo que quede más a la
      // derecha en esa misma fila es la de dólares.
      var itemPesos = null;
      for (var q = 0; q < ws.length; q++) if (ws[q].texto === 'PESOS') itemPesos = ws[q];
      if (itemPesos) {
        xPesos = itemPesos.x1;
        xDolares = null;
        ws.forEach(function (w) {
          if (w.x0 > xPesos + 5 && (xDolares === null || w.x1 > xDolares)) xDolares = w.x1;
        });
        return;
      }

      if (/^TOTAL CONSUMOS/.test(t)) {
        var nums = ws.map(function (w) { return aNumero(w.texto); })
                     .filter(function (v) { return v !== null; });
        r.totalesDeclarados.push({
          texto: t, pesos: nums.length ? nums[0] : null,
          dolares: nums.length > 1 ? nums[1] : null
        });
        return;
      }

      if (!seccion || !ws.length) return;
      var fecha = fechaCorta(ws[0].texto);
      if (!fecha) return;
      leerFila(ws, fecha, seccion, persona, xPesos, xDolares, r);
    });

    r.proyeccion = proyectar(r);
    r.control = controlar(r);
    return r;
  }

  /** Lee un ArrayBuffer con pdfjsLib ya cargado. */
  function leerPdf(buffer, pdfjsLib) {
    return pdfjsLib.getDocument({ data: buffer }).promise.then(function (doc) {
      var paginas = [];
      var cadena = Promise.resolve();
      for (var i = 1; i <= doc.numPages; i++) {
        (function (n) {
          cadena = cadena
            .then(function () { return doc.getPage(n); })
            .then(function (p) { return p.getTextContent(); })
            .then(function (tc) { paginas.push(tc.items); });
        })(i);
      }
      return cadena.then(function () { return leerPaginas(paginas); });
    });
  }

  global.LectorResumen = {
    leerPdf: leerPdf,
    leerPaginas: leerPaginas,
    aNumero: aNumero,
    fechaCorta: fechaCorta,
    sumarMeses: sumarMeses,
    iso: iso
  };
})(typeof window !== 'undefined' ? window : globalThis);

if (typeof module !== 'undefined' && module.exports) {
  module.exports = (typeof window !== 'undefined' ? window : globalThis).LectorResumen;
}

<script>
"use strict";

/* ============================ almacenamiento ============================ */
var memoria = {};
var store = {
  get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return memoria[k]||null; } },
  set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ memoria[k]=v; } }
};
var CFG = { url: store.get('g.url')||'', key: store.get('g.key')||'' };
function guardarCfg(url,key){
  CFG.url=url.trim(); CFG.key=key.trim();
  store.set('g.url',CFG.url); store.set('g.key',CFG.key);
}

/* ============================ API (JSONP) ============================== */
var seq = 0;
function api(params, ms){
  return new Promise(function(res,rej){
    if(!CFG.url || !CFG.key) return rej(new Error('sin-config'));
    var cb='__g'+(++seq)+'_'+Date.now(), s=document.createElement('script');
    var t=setTimeout(function(){ limpiar(); rej(new Error('timeout')); }, ms||25000);
    function limpiar(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(d){ limpiar(); res(d); };
    var qs=Object.keys(params).map(function(k){
      return encodeURIComponent(k)+'='+encodeURIComponent(params[k]===undefined?'':params[k]);
    }).join('&');
    s.src=CFG.url+(CFG.url.indexOf('?')<0?'?':'&')+qs+'&k='+encodeURIComponent(CFG.key)+'&callback='+cb;
    s.onerror=function(){ limpiar(); rej(new Error('red')); };
    document.body.appendChild(s);
  });
}
function apiPost(cuerpo){
  cuerpo.k=CFG.key;
  return fetch(CFG.url,{ method:'POST', body:JSON.stringify(cuerpo),
    headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow' })
    .then(function(r){ return r.json(); });
}

/* ============================ utilidades ============================== */
function fmt(n, moneda){
  n = Number(n)||0;
  var s = Math.abs(Math.round(n*100)/100).toLocaleString('es-AR',
    {minimumFractionDigits:(Math.abs(n)%1?2:0), maximumFractionDigits:2});
  return (n<0?'-':'') + (moneda==='USD'?'U$S ':'$ ') + s;
}
function fmtCorto(n, moneda){
  n = Number(n)||0;
  return (n<0?'-':'') + (moneda==='USD'?'U$S ':'$ ') +
    Math.abs(Math.round(n)).toLocaleString('es-AR',{maximumFractionDigits:0});
}
/* Para los pies de gráfico, donde no entra el número completo: "$ 3,7 M" */
function fmtCompacto(n){
  n=Number(n)||0;
  var a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e6) return s+'$ '+(a/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M';
  if(a>=1e4) return s+'$ '+Math.round(a/1e3).toLocaleString('es-AR')+' k';
  return fmtCorto(n);
}
function hoyISO(d){
  d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isoADia(iso){ var p=String(iso).split('-'); return p[2]+'/'+p[1]; }
function etiquetaFecha(iso){
  var h=hoyISO(), a=hoyISO(new Date(Date.now()-864e5));
  if(iso===h) return 'Hoy';
  if(iso===a) return 'Ayer';
  return new Date(iso+'T12:00:00').toLocaleDateString('es-AR',
    {weekday:'long',day:'numeric',month:'long'});
}
function aNumero(t){
  t=String(t).replace(/[^\d.,-]/g,'');
  var neg=t.indexOf('-')>=0; t=t.replace(/-/g,'');
  var v;
  if(/^\d{1,3}([.,]\d{3})+$/.test(t)) v=parseFloat(t.replace(/[.,]/g,''));
  else if(t.indexOf('.')>=0 && t.indexOf(',')>=0){
    var dec=t.lastIndexOf('.')>t.lastIndexOf(',')?'.':',', mil=dec==='.'?',':'.';
    v=parseFloat(t.split(mil).join('').replace(dec,'.'));
  } else v=parseFloat(t.replace(',','.'));
  return isNaN(v)?NaN:(neg?-v:v);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ============================ estado ================================== */
var ST = {
  monto:'', fecha:hoyISO(), medio:'', moneda:'ARS', ingreso:false, verTodas:false,
  cats:[], tipos:[], personas:[], medios:[], planilla:'',
  movimientos:[], resumen:null, serie:[]
};
var TOP_CATS = 15;

function cat(nombre){
  for(var i=0;i<ST.cats.length;i++) if(ST.cats[i].nombre===nombre) return ST.cats[i];
  return null;
}
function emoji(nombre){ var c=cat(nombre); return (c&&c.emoji)?c.emoji:'•'; }
function tipoDe(nombre){ var c=cat(nombre); return c?c.tipo:''; }
function esCategoriaDeIngreso(nombre){
  var t=tipoDe(nombre);
  for(var i=0;i<ST.tipos.length;i++) if(ST.tipos[i].nombre===t) return ST.tipos[i].naturaleza==='Ingreso';
  return false;
}

/* ============================ toast =================================== */
var toastT;
function toast(txt, accionTxt, accion){
  document.getElementById('toastTxt').innerHTML=txt;
  var b=document.getElementById('toastBtn');
  if(accionTxt){ b.textContent=accionTxt; b.style.display=''; b.onclick=function(){ ocultarToast(); accion&&accion(); }; }
  else b.style.display='none';
  document.getElementById('toast').classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(ocultarToast, accionTxt?5200:2600);
}
function ocultarToast(){ document.getElementById('toast').classList.remove('on'); }

/* ============================ sheet =================================== */
function abrirSheet(html){
  document.getElementById('sheetBody').innerHTML=html;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('velo').classList.add('on');
}
function cerrarSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('velo').classList.remove('on');
}
document.getElementById('velo').onclick=cerrarSheet;
document.getElementById('btnCerrarSheet').onclick=cerrarSheet;

/* Arrastrar hacia abajo para cerrar.
   Solo agarra desde la barra de arriba, o desde el cuerpo cuando ya estás
   arriba de todo. Si no, cada vez que quisieras subir en la lista del lector
   se te cerraría la pantalla. */
(function(){
  var hoja=document.getElementById('sheet');
  var top=document.getElementById('sheetTop');
  var y0=null, dy=0, desdeArriba=false;

  function empezar(e){
    var t=e.touches?e.touches[0]:e;
    desdeArriba = top.contains(e.target) || hoja.scrollTop<=0;
    if(!desdeArriba) return;
    y0=t.clientY; dy=0;
    hoja.classList.add('arrastrando');
  }
  function mover(e){
    if(y0===null) return;
    var t=e.touches?e.touches[0]:e;
    dy=t.clientY-y0;
    if(dy<0){ dy=0; return; }
    if(hoja.scrollTop>0 && !top.contains(e.target)){ soltar(); return; }
    hoja.style.transform='translateY('+dy+'px)';
    document.getElementById('velo').style.opacity=String(Math.max(0,1-dy/400));
    if(e.cancelable) e.preventDefault();
  }
  function soltar(){
    if(y0===null) return;
    hoja.classList.remove('arrastrando');
    hoja.style.transform='';
    document.getElementById('velo').style.opacity='';
    if(dy>110) cerrarSheet();
    y0=null; dy=0;
  }
  top.addEventListener('touchstart',empezar,{passive:true});
  hoja.addEventListener('touchstart',empezar,{passive:true});
  hoja.addEventListener('touchmove',mover,{passive:false});
  hoja.addEventListener('touchend',soltar);
  hoja.addEventListener('touchcancel',soltar);
})();

/* ============================ navegación ============================== */
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tab'); if(b) irA(b.dataset.p);
});
function irA(p){
  [].forEach.call(document.querySelectorAll('.pantalla'),function(s){ s.classList.remove('on'); });
  [].forEach.call(document.querySelectorAll('.tab'),function(t){ t.classList.toggle('on', t.dataset.p===p); });
  document.getElementById('p-'+p).classList.add('on');
  if(p==='ultimos') cargarLista();
  if(p==='mes') cargarMes();
  if(p==='mas') pintarMas();
}

/* ============================ teclado ================================= */
(function(){
  var t=document.getElementById('teclado');
  ['1','2','3','4','5','6','7','8','9',',','0','⌫'].forEach(function(k){
    var b=document.createElement('button');
    b.className='tecla'+(k===','||k==='⌫'?' aux':'');
    b.textContent=k; b.dataset.k=k; t.appendChild(b);
  });
  t.addEventListener('click',function(e){
    var b=e.target.closest('.tecla'); if(!b) return;
    var k=b.dataset.k;
    if(k==='⌫') ST.monto=ST.monto.slice(0,-1);
    else if(k===','){ if(ST.monto.indexOf(',')<0 && ST.monto) ST.monto+=','; }
    else{
      var dec=ST.monto.split(',')[1];
      if(dec!==undefined && dec.length>=2) return;
      if(ST.monto.replace(',','').length>=11) return;
      ST.monto+=k;
    }

    hold=setTimeout(function(){ ST.monto=''; pintarMonto(); if(navigator.vibrate) navigator.vibrate(25); },450);
  },{passive:true});

})();

/* En la pantalla de carga van por uso: querés las de todos los días arriba,
   a un toque. En los desplegables van alfabéticas: ahí buscás un nombre. */
function catsOrdenadas(){
  return ST.cats.slice().sort(function(a,b){
    return (b.frecuencia||0)-(a.frecuencia||0) || a.nombre.localeCompare(b.nombre,'es');
  });
}
function catsAlfabeticas(){
  return ST.cats.slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre,'es'); });
}
function pintarCats(){
  var todas=catsOrdenadas();

      '<span class="e">'+(c.emoji||'•')+'</span><span>'+esc(c.nombre)+'</span></button>';
  }).join('');

function sugerir(){

function guardar(categoria){
  var monto=montoNum();
  if(!monto || monto<=0){
    document.getElementById('subCarga').textContent='Primero poné el monto';
    if(navigator.vibrate) navigator.vibrate([12,60,12]);
    return;
  }
  var ingreso = ST.ingreso || esCategoriaDeIngreso(categoria);
  var m={ op:'agregar', monto:monto, moneda:ST.moneda, fecha:ST.fecha, categoria:categoria,
          detalle:document.getElementById('desc').value.trim(), medio:ST.medio,
          esIngreso:ingreso, origen:'web' };
  var etiqueta=(ingreso?'+':'')+fmt(monto,ST.moneda)+' · '+categoria;
  limpiarCarga();
  if(navigator.vibrate) navigator.vibrate(16);

  api(m).then(function(r){
    if(!r||!r.ok) throw new Error((r&&r.error)||'no se guardó');
    ST.resumen=r.resumen;
    toast('✅ '+esc(etiqueta),'Deshacer',function(){ borrar(r.id); });
  }).catch(function(){
    encolar(m);
    toast('📥 '+esc(etiqueta)+' <span class="pill">sin señal</span>');
  });
}
function limpiarCarga(){
  ST.monto=''; ST.medio=''; ST.fecha=hoyISO(); ST.ingreso=false;
  var d=document.getElementById('desc'); d.value=''; d.blur();
  document.getElementById('subCarga').textContent='Tocá una categoría para guardar';
  pintarMonto(); pintarChips();
}

}

/* ===================== cola offline =================================== */
function cola(){ try{ return JSON.parse(store.get('g.cola')||'[]'); }catch(e){ return []; } }
function encolar(m){ var c=cola(); c.push(m); store.set('g.cola',JSON.stringify(c)); pintarPendientes(); }
function pintarPendientes(){
  var n=cola().length;
  document.querySelector('.tab[data-p="mas"]').innerHTML='<span class="i">⚙</span>Más'+(n?' ('+n+')':'');
}
function vaciarCola(){
  var c=cola();
  if(!c.length||!CFG.url) return Promise.resolve(0);
  var env=0;
  return c.reduce(function(p,m){
    return p.then(function(){ return api(m).then(function(r){ if(r&&r.ok) env++; }).catch(function(){}); });
  },Promise.resolve()).then(function(){
    store.set('g.cola',JSON.stringify(c.slice(env)));
    pintarPendientes();
    if(env) toast('Sincronicé '+env+' movimiento'+(env>1?'s':''));
    return env;
  });
}
window.addEventListener('online', vaciarCola);
window.vaciarCola=vaciarCola;

function cargarLista(silencioso){
  var cont=document.getElementById('lista');
  if(!silencioso) cont.innerHTML='<div class="vacio">Cargando…</div>';
  api({op:'listar',limite:80}).then(function(r){
    if(!r||!r.ok) throw new Error('error');
    ST.movimientos=r.movimientos;
    if(!r.movimientos.length){
      cont.innerHTML='<div class="vacio">Todavía no hay movimientos.</div>'; return;
    }
    var hoy=hoyISO();
    // Lo que ya pasó va primero; las cuotas que dejaste cargadas a futuro,
    // al final y atenuadas.
    var pasados=r.movimientos.filter(function(m){ return m.fecha<=hoy; });
    var futuros=r.movimientos.filter(function(m){ return m.fecha>hoy; });

    function bloque(lista, futuro){
      var h='', dia='';
      lista.forEach(function(m){
        if(m.fecha!==dia){
          dia=m.fecha;
          h+='<div class="dia">'+(futuro?isoADia(m.fecha):etiquetaFecha(m.fecha))+'</div>';
        }
        var mas=m.importe>0;
        h+='<div class="item" data-id="'+m.id+'"'+(futuro?' style="opacity:.7"':'')+'>'+
          '<span class="e">'+emoji(m.categoria)+'</span>'+
          '<span class="txt"><span class="t1">'+(esc(m.detalle)||esc(m.categoria))+'</span>'+
          '<span class="t2">'+esc(m.categoria)+
            (m.persona?' · 👤 '+esc(m.persona):'')+
            (m.medio?' · '+esc(m.medio):'')+
            (m.origen&&m.origen.indexOf('telegram')===0?' · 📩':'')+
            (m.origen==='import'?' · 💳':'')+'</span></span>'+
          '<span class="m'+(mas?' mas':'')+'">'+(mas?'+':'')+fmt(Math.abs(m.importe),m.moneda)+
          '</span></div>';
      });
      return h;
    }

    var html=bloque(pasados,false);
    if(futuros.length){
      html+='<div class="dia" style="color:var(--accent);padding-top:22px">'+
        'Proyectado · '+futuros.length+'</div>'+bloque(futuros,true);
    }
    cont.innerHTML=html;
  }).catch(function(){
    cont.innerHTML='<div class="vacio">No pude conectarme.<br>Revisá la configuración en <b>Más</b>.</div>';
  });
}

/* Los tres tipos de gasto que mirás todos los meses. Si algún día agregás otro
   tipo, no desaparece: cae en un cuarto recuadro "Otros". */
var TIPOS_TILE = [
  { cod:'02', lab:'Esenciales' },
  { cod:'03', lab:'Secundarios' },
  { cod:'04', lab:'Cuota alim.' }
];
function totalesPorTipo(m){
  var mapa={}, otros=0;
  (m.porTipo||[]).forEach(function(t){
    var cod=String(t.tipo).slice(0,2), conocido=false;
    TIPOS_TILE.forEach(function(x){ if(x.cod===cod) conocido=true; });
    if(conocido) mapa[cod]=(mapa[cod]||0)+t.total; else otros+=t.total;
  });
  var out=TIPOS_TILE.map(function(x){ return { lab:x.lab, total:mapa[x.cod]||0 }; });
  if(otros>0) out.push({ lab:'Otros', total:otros });
  return out;
}

/* En los recuadros chicos el número entero no siempre entra: si se pasa de
   largo, lo abrevio. El monto exacto siempre está en las barras de abajo. */
function fmtTile(n){
  var s=fmtCorto(n);
  return s.length>10 ? fmtCompacto(n) : s;
}

function htmlMes(m, serie){
  var h='';
  var proyectado = (m.proyectado!=null?m.proyectado:m.comprometido)||0;

  h+='<div class="hero"><div class="lab">Gasto del mes</div>'+
     '<div class="val">'+fmtCorto(m.gastos)+'</div>'+
     '<div class="pie">día '+m.dia+' de '+m.diasMes+' · a este ritmo, '+
       fmtCompacto(m.proyeccion)+'</div></div>';

  h+='<div class="tiles tres">'+totalesPorTipo(m).map(function(t){
       var pct=m.gastos?Math.round(t.total/m.gastos*100):0;
       return '<div class="tile"><div class="lab">'+esc(t.lab)+'</div>'+
         '<div class="val">'+fmtTile(t.total)+'</div>'+
         '<div class="pie">'+pct+'% del mes</div></div>';
     }).join('')+'</div>';

  var positivo = m.ahorro>=0;
  h+='<div class="tiles">'+
     '<div class="tile"><div class="lab">Ahorro</div>'+
       '<div class="val '+(positivo?'mas':'menos')+'">'+fmtTile(m.ahorro)+'</div>'+
       '<div class="pie">'+fmtCompacto(m.ingresos)+' de ingresos</div></div>'+
     '<div class="tile"><div class="lab">Proyectado</div>'+
       '<div class="val">'+fmtTile(proyectado)+'</div>'+
       '<div class="pie">'+(proyectado?'falta pagar este mes':'nada cargado a futuro')+'</div></div>'+
     '</div>';

  if(serie.length>1) h+=htmlEvolucion(serie);

  if(m.personas && m.personas.length){
    h+='<div class="titulo enScroll">Saldos con personas</div>';
    m.personas.forEach(function(p){
      h+='<div class="persona"><span class="e">👤</span>'+
         '<span class="txt"><span class="n">'+esc(p.nombre)+'</span>'+
         '<span class="v">'+esc([p.vinculo,p.concepto].filter(Boolean).join(' · '))+'</span></span>'+
         '<span class="s '+(p.saldo<0?'menos':'mas')+'">'+fmtCorto(p.saldo)+'</span></div>';
    });
    h+='<div class="nota">Negativo = plata que pusiste vos. No entra en el gasto del mes.</div>';
  }

  /* El reparto por tipo ya está arriba en los tres recuadros: repetirlo acá
     como barras era el mismo dato dos veces. Queda el detalle por categoría. */
  if(m.porCategoria && m.porCategoria.length){
    h+='<div class="titulo enScroll">En qué se va</div>';
    var maxC=m.porCategoria[0].total||1;
    m.porCategoria.forEach(function(c){
      var pct=m.gastos?Math.round(c.total/m.gastos*100):0;
      h+=barra(emoji(c.categoria)+' '+c.categoria, c.total, c.total/maxC, pct);
    });
  }
  return h+'<div style="height:8px"></div>';
}

function barra(nombre, total, ratio, pct){
  return '<div class="barra"><div class="fila">'+
    '<span class="nom">'+esc(nombre)+'</span>'+
    '<span class="val">'+fmtCorto(total)+'<span class="pct">'+pct+'%</span></span></div>'+
    '<div class="pista"><div class="rell" style="width:'+Math.max(2,ratio*100)+'%"></div></div></div>';
}

/* Ahorro mes a mes. Es polaridad, así que van dos colores opuestos
   separados por el cero: azul lo que ahorraste, rojo lo que te pasaste. */
function htmlEvolucion(serie){
  var maxPos=0, maxNeg=0;
  serie.forEach(function(m){
    if(m.ahorro>maxPos) maxPos=m.ahorro;
    if(m.ahorro<maxNeg) maxNeg=m.ahorro;
  });
  var esc1=Math.max(maxPos, Math.abs(maxNeg))||1;
  var hayNeg = maxNeg<0;
  var altoArriba = hayNeg?60:96, altoAbajo = hayNeg?40:4;

  var barras=serie.map(function(m,i){
    var ult=i===serie.length-1;
    var pos=m.ahorro>=0;
    var alto=Math.max(2, Math.abs(m.ahorro)/esc1*(pos?altoArriba:altoAbajo));
    return '<div class="evoMes">'+
      '<div class="evoArriba" style="flex:0 0 '+altoArriba+'px">'+
        (pos?'<div class="evoBar" style="height:'+alto+'px;'+(ult?'':'opacity:.72')+'"></div>':'')+
      '</div>'+
      '<div class="evoAbajo" style="flex:0 0 '+altoAbajo+'px">'+
        (pos?'':'<div class="evoBar" style="height:'+alto+'px;'+(ult?'':'opacity:.72')+'"></div>')+
      '</div></div>';
  }).join('');

  var ejes=serie.map(function(m,i){
    var mm=+m.mes.split('-')[1];
    var ini=['E','F','M','A','M','J','J','A','S','O','N','D'][mm-1];
    return '<div class="evoEje'+(i===serie.length-1?' hoy':'')+'">'+ini+'</div>';
  }).join('');

  var ult=serie[serie.length-1];
  var mejor=serie.reduce(function(a,b){ return b.ahorro>a.ahorro?b:a; });
  var prom=serie.reduce(function(a,b){ return a+b.ahorro; },0)/serie.length;

  return '<div class="evo">'+
    '<div class="lab" style="font-size:10.5px;color:var(--muted);text-transform:uppercase;'+
      'letter-spacing:.05em;font-weight:600;margin-bottom:9px">Ahorro mes a mes</div>'+
    '<div class="evoGraf">'+barras+'<div class="evoCero" style="top:'+altoArriba+'px"></div></div>'+
    '<div class="evoEjes">'+ejes+'</div>'+
    '<div class="evoPie"><span>En curso <b style="color:var(--ink)">'+fmtCompacto(ult.ahorro)+'</b></span>'+
    '<span>Promedio '+fmtCompacto(prom)+'</span>'+
    '<span>Mejor '+fmtCompacto(mejor.ahorro)+'</span></div></div>';
}

/* ======================= depurar categorías =========================== */
/* Borrar la fila a mano en la planilla no rompe nada —la categoría es texto en
   cada movimiento— pero te deja gastos viejos apuntando a un nombre que ya no
   existe: siguen sumando, sueltos, y no los podés reasignar. Por eso acá hay
   dos acciones distintas: borrar (solo si no tiene movimientos) y unificar. */
var USO=null;
var MESES_CORTOS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function mesCorto(iso){        // "2022-09" -> "sep 2022"
  var p=String(iso).split('-');
  return (MESES_CORTOS[+p[1]-1]||p[1])+' '+p[0];
}

window.pantallaCategorias=function(){
  abrirSheet('<h3>Depurar categorías</h3>'+
    '<div class="nota">Las que no tienen movimientos se borran y listo. '+
    'Las que sí tienen, se <b>unifican</b>: los gastos viejos pasan a la categoría '+
    'que elijas y no se pierde ninguno.</div>'+
    '<div id="catUso"></div>');
  recargarUsoCats();
};

function recargarUsoCats(){
  var cont=document.getElementById('catUso'); if(!cont) return;
  cont.innerHTML='<div class="nota">Leyendo el uso de cada categoría…</div>';
  api({op:'usoCategorias'},30000).then(function(r){
    if(!r||!r.ok) throw new Error((r&&r.error)||'sin respuesta');
    USO=r.categorias||[];
    pintarUsoCats();
  }).catch(function(e){
    var c=document.getElementById('catUso');
    if(c) c.innerHTML='<div class="err">No pude leer el uso ('+esc(e.message)+').</div>';
  });
}

function pintarUsoCats(){
  var cont=document.getElementById('catUso'); if(!cont) return;
  if(!USO.length){ cont.innerHTML='<div class="nota">No hay categorías todavía.</div>'; return; }

  var huerfanas=USO.filter(function(c){ return c.veces&&c.huerfana; });
  var sinUso   =USO.filter(function(c){ return !c.veces; });
  var enUso    =USO.filter(function(c){ return c.veces&&!c.huerfana; });

  var h='';
  if(huerfanas.length)
    h+='<div class="titulo enScroll">Fuera de la lista · '+huerfanas.length+'</div>'+
       '<div class="nota" style="margin-top:0">Están escritas en movimientos viejos pero ya no '+
       'aparecen para elegir. Unificalas y dejás de tenerlas sueltas.</div>'+
       huerfanas.map(filaCat).join('');
  if(sinUso.length)
    h+='<div class="titulo enScroll">Sin movimientos · '+sinUso.length+'</div>'+
       sinUso.map(filaCat).join('');
  if(enUso.length)
    h+='<div class="titulo enScroll">En uso · '+enUso.length+'</div>'+
       enUso.map(filaCat).join('');
  cont.innerHTML=h;
}

function filaCat(c){
  var i=USO.indexOf(c);
  var destinos=USO.filter(function(o){ return o.nombre!==c.nombre && !o.huerfana; })
    .map(function(o){ return o.nombre; })
    .sort(function(a,b){ return a.localeCompare(b,'es'); })
    .map(function(n){ return '<option>'+esc(n)+'</option>'; }).join('');

  var detalle = c.veces
    ? c.veces+(c.veces===1?' movimiento':' movimientos')+' · '+fmtCompacto(c.total)+
      (c.ultima?' · última vez '+mesCorto(c.ultima):'')
    : 'nunca la usaste';

  return '<div class="item" style="align-items:flex-start" data-cat="'+esc(c.nombre)+'">'+
    '<span class="e">'+(c.emoji||'•')+'</span>'+
    '<span class="txt"><span class="t1">'+esc(c.nombre)+'</span>'+
    '<span class="t2">'+esc(detalle)+'</span>'+
    (c.veces
      ? '<select class="selMini" onchange="unificarCat('+i+',this.value)">'+
        '<option value="">Unificar con…</option>'+destinos+'</select>'
      : '')+
    '</span>'+
    (c.veces?'':'<button class="mini peligro" onclick="borrarCat('+i+')">Borrar</button>')+
    '</div>';
}

window.unificarCat=function(i,destino){
  var c=USO[i];
  if(!destino||!c){ pintarUsoCats(); return; }
  var ok=confirm('Pasar los '+c.veces+' movimientos de "'+c.nombre+'" a "'+destino+'".\n\n'+
    'No se pierde ninguno: se reescribe la categoría en cada uno. '+
    '"'+c.nombre+'" desaparece de la lista.');
  if(!ok){ pintarUsoCats(); return; }

  var cont=document.getElementById('catUso');
  if(cont) cont.innerHTML='<div class="nota">Unificando… puede tardar unos segundos.</div>';
  apiPost({op:'unificar', origen:c.nombre, destino:destino}).then(function(r){
    if(!r||!r.ok) throw new Error((r&&r.error)||'no se pudo');
    toast(r.movimientos+(r.movimientos===1?' movimiento pasado a ':' movimientos pasados a ')+r.destino);
    cargarConfigRemota();
    recargarUsoCats();
  }).catch(function(e){
    if(cont) cont.innerHTML='<div class="err">No pude unificar ('+esc(e.message)+').</div>'+
      '<button class="btn sec" onclick="recargarUsoCats()">Volver a la lista</button>';
  });
};

window.borrarCat=function(i){
  var c=USO[i]; if(!c) return;
  if(!confirm('Borrar la categoría "'+c.nombre+'".\n\nNo tiene movimientos, así que no se pierde nada.')) return;
  var cont=document.getElementById('catUso');
  if(cont) cont.innerHTML='<div class="nota">Borrando…</div>';

    if(!r||!r.ok) throw new Error((r&&r.error)||'no se pudo');
    toast('Categoría borrada');

    recargarUsoCats();
  }).catch(function(e){
    if(cont) cont.innerHTML='<div class="err">No pude borrar ('+esc(e.message)+').</div>'+
      '<button class="btn sec" onclick="recargarUsoCats()">Volver a la lista</button>';

};

/* ------------------------- resumen en PDF ----------------------------- */
var PDFJS_VER='3.11.174';
var PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_VER+'/pdf.min.js';
var PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_VER+'/pdf.worker.min.js';
var RES=null;   // el resumen leído, mientras lo revisás

/* pdf.js pesa ~1 MB: se baja recién cuando elegís un PDF, no al abrir la app. */
function cargarPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src=PDFJS_URL;
    s.onload=function(){
      if(!window.pdfjsLib) return rej(new Error('no cargó pdf.js'));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
      res(window.pdfjsLib);
    };
    s.onerror=function(){ rej(new Error('sin conexión para bajar el lector')); };
    document.body.appendChild(s);
  });
}

function leerPdfResumen(file){
  var salida=document.getElementById('impSalida');
  salida.innerHTML='<div class="nota">Leyendo el resumen…</div>';
  cargarPdfJs().then(function(pdfjsLib){
    return file.arrayBuffer().then(function(buf){
      return LectorResumen.leerPdf(new Uint8Array(buf), pdfjsLib);
    });
  }).then(function(r){
    RES=r;
    return sugerirCategorias(r);
  }).then(function(){
    pintarRevision();
  }).catch(function(e){
    salida.innerHTML='<div class="err">No pude leer el PDF: '+esc(e.message)+'</div>'+
      '<div class="nota">Si es un resumen escaneado (una foto adentro de un PDF) '+
      'no tiene texto para leer. Probá bajarlo de nuevo desde el home banking.</div>';
  });
}

/* Las palabras clave viven en tu hoja Categorias: le preguntamos al servidor
   en vez de tener una segunda copia acá que se desincronice. */
function sugerirCategorias(r){
  var lineas=lineasImportables(r);
  if(!lineas.length) return Promise.resolve();
  return apiPost({ op:'sugerir', textos: lineas.map(function(l){ return l.detalle; }) })
    .then(function(res){
      if(!res||!res.ok) return;
      res.sugerencias.forEach(function(s,i){
        lineas[i].categoria = lineas[i].categoria || s.categoria || '';
      });
    }).catch(function(){});
}

/** Las filas del resumen que se pueden cargar, ya con fecha y signo resueltos. */
function lineasImportables(r){
  if(r._lineas) return r._lineas;
  var venc=r.vencimiento?LectorResumen.iso(r.vencimiento):hoyISO();
  var out=[];

  r.movimientos.forEach(function(m){
    if(m.seccion==='pagos') return;                 // es el pago del resumen anterior
    var monto=m.pesos||m.dolares;
    if(!monto) return;
    var esUSD=!m.pesos&&!!m.dolares;
    var detalle=m.descripcion;
    if(m.cuota) detalle+=' '+m.cuota.nro+'/'+m.cuota.total;
    out.push({
      fecha: venc,                                  // el día que sale la plata
      detalle: detalle,
      monto: Math.abs(monto),
      moneda: esUSD?'USD':'ARS',
      medio: 'Crédito',
      categoria: m.seccion==='impuestos'?'Impuestos':'',
      titular: m.titular||'',
      notas: m.titular&&r.titular&&!mismoTitular(m.titular,r.titular)?('Titular: '+m.titular):'',
      cuota: m.cuota,
      incluir: true
    });
  });

  (r.proyeccion||[]).forEach(function(p){
    p.detalle.forEach(function(d){
      out.push({
        fecha: p.fecha, detalle: d.comercio+' '+d.cuota, monto: d.monto,
        moneda:'ARS', medio:'Crédito', categoria:'', titular: d.titular||'',
        notas: d.titular&&r.titular&&!mismoTitular(d.titular,r.titular)?('Titular: '+d.titular):'',
        futura:true, incluir:true
      });
    });
  });

  r._lineas=out;
  return out;
}

function mismoTitular(a,b){
  var n=function(s){ return String(s).toLowerCase().replace(/[^a-z ]/g,'').split(' ')
    .filter(function(x){return x.length>2;}).sort().join(' '); };
  var A=n(a).split(' '), B=n(b).split(' ');
  return A.filter(function(x){ return B.indexOf(x)>=0; }).length>=2;
}

function pintarRevision(){
  var r=RES, salida=document.getElementById('impSalida');
  var lineas=lineasImportables(r);
  var venc=r.vencimiento?isoADia(LectorResumen.iso(r.vencimiento)):'—';

  var ahora=lineas.filter(function(l){ return !l.futura; });
  var futuras=lineas.filter(function(l){ return l.futura; });
  var totARS=ahora.reduce(function(a,l){ return a+(l.moneda==='ARS'&&l.incluir?l.monto:0); },0);
  var totUSD=ahora.reduce(function(a,l){ return a+(l.moneda==='USD'&&l.incluir?l.monto:0); },0);

  var h='<div class="tile" style="margin:6px 0 12px">'+
    '<div class="lab">'+esc((r.tarjeta&&r.tarjeta.nombre)||'Resumen')+'</div>'+
    '<div class="val">'+fmtCorto(totARS)+(totUSD?' + U$S '+totUSD.toFixed(2):'')+'</div>'+
    '<div class="pie">'+ahora.length+' líneas · todas con fecha '+venc+'</div></div>';

  if(r.control&&r.control.filas.length){
    h+= r.control.ok
      ? '<div class="ok" style="margin-bottom:12px">✅ Las cuotas cuadran con la tabla del banco.</div>'
      : '<div class="err" style="margin-bottom:12px">⚠️ Mi cálculo de cuotas no coincide con el del banco. Revisá antes de importar.</div>';
  }

  h+='<div class="titulo enScroll">Este resumen</div>'+ahora.map(filaRevision).join('');

  if(futuras.length){
    h+='<div class="titulo enScroll">Cuotas que vienen</div>'+
       '<div class="nota" style="margin-top:0">Quedan cargadas como proyectado. '+
       'Cuando lleguen en el próximo resumen se confirman solas, no se duplican.</div>'+
       futuras.map(filaRevision).join('');
  }

  h+='<div style="height:6px"></div>'+
     '<button class="btn" onclick="confirmarResumen()">Importar '+
     lineas.filter(function(l){return l.incluir;}).length+' movimientos</button>'+
     '<div id="impRes"></div>';
  salida.innerHTML=h;
}

function filaRevision(l,i){
  var idx=lineasImportables(RES).indexOf(l);
  if(RES._nuevaEn===idx) return formNuevaCategoria(l,idx);
  var opciones=catsAlfabeticas().map(function(c){
    return '<option'+(c.nombre===l.categoria?' selected':'')+'>'+
      (c.emoji?c.emoji+' ':'')+esc(c.nombre)+'</option>';
  }).join('');
  return '<div class="item" style="align-items:flex-start;'+(l.incluir?'':'opacity:.4')+'">'+
    '<input type="checkbox" '+(l.incluir?'checked':'')+' style="width:auto;margin-top:4px" '+
      'onchange="alternarLinea('+idx+',this.checked)">'+
    '<span class="txt">'+
      '<span class="t1">'+esc(l.detalle)+'</span>'+
      '<span class="t2" style="white-space:normal">'+
        (l.categoria?'':'<b style="color:var(--neg)">elegí categoría</b> · ')+
        (l.futura?'vence ':'')+isoADia(l.fecha)+
        (l.titular?' · '+esc(l.titular):'')+'</span>'+
      '<select style="margin-top:6px;width:100%;background:var(--surface-2);border:1px solid var(--line);'+
        'border-radius:9px;padding:7px 8px;color:var(--ink);font-size:14px" '+
        'onchange="ponerCategoria('+idx+',this.value)">'+

        '<option value="__nueva__">➕ Crear una categoría nueva…</option></select>'+
    '</span>'+
    '<span class="m">'+(l.moneda==='USD'?'U$S '+l.monto.toFixed(2):fmtCorto(l.monto))+'</span></div>';

window.alternarLinea=function(i,v){ lineasImportables(RES)[i].incluir=v; pintarRevision(); };
window.ponerCategoria=function(i,v){
  if(v==='__nueva__'){ RES._nuevaEn=i; pintarRevision(); return; }
  var l=lineasImportables(RES)[i];
  l.categoria=quitarEmoji(v);
  l.aprender=true;          // la elegiste vos: que se la guarde para la próxima
  pintarRevision();
};

/* Los <option> llevan el emoji adelante para que se reconozcan de un vistazo,
   pero lo que se guarda es el nombre pelado. */
function quitarEmoji(v){
  var n=String(v||'');
  for(var i=0;i<ST.cats.length;i++){
    var c=ST.cats[i];
    if(n===c.nombre || n===(c.emoji+' '+c.nombre)) return c.nombre;
  }
  return n;
}

var IMP={ filas:[], cols:[], mapa:{} };

function partirLinea(l,sep){
  var out=[],act='',dentro=false;
  for(var i=0;i<l.length;i++){
    var c=l[i];
    if(c==='"'){ if(dentro&&l[i+1]==='"'){ act+='"'; i++; } else dentro=!dentro; }
    else if(c===sep&&!dentro){ out.push(act); act=''; }
    else act+=c;
  }
  out.push(act);
  return out.map(function(s){ return s.trim(); });
}

window.analizarCSV=function(){
  var txt=document.getElementById('impTexto').value.trim();
  var salida=document.getElementById('impSalida');
  if(!txt){ salida.innerHTML='<div class="err">No hay nada para analizar.</div>'; return; }

  var lineas=txt.split(/\r?\n/).filter(function(l){ return l.trim(); });
  var sep=[';','\t',','].map(function(s){
    return { s:s, n:lineas[0].split(s).length+((lineas[1]||'').split(s).length) };
  }).sort(function(a,b){ return b.n-a.n; })[0].s;

  var tabla=lineas.map(function(l){ return partirLinea(l,sep); });
  var iCab=0;
  for(var i=0;i<Math.min(6,tabla.length);i++){
    var tieneNum=tabla[i].some(function(c){ return /^-?[\d.,]+$/.test(c)&&/\d/.test(c); });
    if(!tieneNum&&tabla[i].length>1){ iCab=i; break; }
  }
  var cols=tabla[iCab], datos=tabla.slice(iCab+1).filter(function(f){ return f.length>=2; });

  function buscar(res){
    for(var i=0;i<cols.length;i++){
      var c=cols[i].toLowerCase().replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i')
        .replace(/ó/g,'o').replace(/ú/g,'u');
      if(res.some(function(r){ return r.test(c); })) return i;
    }
    return -1;
  }
  IMP.mapa={
    fecha: buscar([/fecha/,/^dia$/,/date/]),
    desc:  buscar([/descrip/,/detalle/,/concepto/,/comercio/,/movimiento/,/referencia/]),
    monto: buscar([/importe/,/monto/,/pesos/,/cargo/,/debito/,/amount/,/total/])
  };
  if(IMP.mapa.monto<0){
    for(var j=cols.length-1;j>=0;j--){
      if(datos[0]&&!isNaN(aNumero(datos[0][j]||''))){ IMP.mapa.monto=j; break; }
    }
  }
  IMP.cols=cols; IMP.filas=datos;

  function sel(n,s){
    return '<select id="map_'+n+'">'+cols.map(function(c,i){
      return '<option value="'+i+'"'+(i===s?' selected':'')+'>'+esc(c||('columna '+(i+1)))+'</option>';
    }).join('')+'</select>';
  }
  salida.innerHTML=
    '<div class="nota" style="margin-top:16px">Encontré <b>'+datos.length+'</b> filas. Confirmá las columnas:</div>'+
    '<div class="campo"><label>Fecha</label>'+sel('fecha',IMP.mapa.fecha)+'</div>'+
    '<div class="campo"><label>Detalle</label>'+sel('desc',IMP.mapa.desc)+'</div>'+
    '<div class="campo"><label>Importe</label>'+sel('monto',IMP.mapa.monto)+'</div>'+
    '<div class="campo"><label>Medio de pago</label><select id="map_medio">'+
      ST.medios.map(function(m){ return '<option'+(m==='Crédito'?' selected':'')+'>'+m+'</option>'; }).join('')+
    '</select></div>'+
    '<label style="font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;margin-bottom:14px">'+
      '<input type="checkbox" id="map_neg" checked style="width:auto"> Ignorar importes negativos (pagos y créditos)</label>'+
    '<button class="btn sec" onclick="previsualizar()" style="margin-bottom:10px">Ver vista previa</button>'+
    '<div id="impPrev"></div>';
};

function filasNormalizadas(){
  var iF=+document.getElementById('map_fecha').value;
  var iD=+document.getElementById('map_desc').value;
  var iM=+document.getElementById('map_monto').value;
  var medio=document.getElementById('map_medio').value;
  var ignora=document.getElementById('map_neg').checked;
  return IMP.filas.map(function(f){
    var monto=aNumero(f[iM]||'');
    if(isNaN(monto)||monto===0) return null;
    if(monto<0&&ignora) return null;
    return { fecha:normFecha(f[iF]||''), detalle:(f[iD]||'').replace(/\s+/g,' ').trim(),
             monto:Math.abs(monto), medio:medio };
  }).filter(Boolean);
}
function normFecha(s){
  s=String(s).trim();
  var m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ var a=m[3].length===2?'20'+m[3]:m[3];
    return a+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'); }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?m[0]:hoyISO();
}
window.previsualizar=function(){
  var f=filasNormalizadas(), p=document.getElementById('impPrev');
  if(!f.length){ p.innerHTML='<div class="err">No pude leer ninguna fila válida. Probá cambiando las columnas.</div>'; return; }
  p.innerHTML='<table class="prev"><tr><th>Fecha</th><th>Detalle</th><th>Importe</th></tr>'+
    f.slice(0,6).map(function(x){
      return '<tr><td>'+isoADia(x.fecha)+'</td><td>'+esc(x.detalle)+'</td><td>'+fmt(x.monto)+'</td></tr>';
    }).join('')+'</table>'+
    '<div class="nota">'+f.length+' filas listas. Total: <b>'+
      fmt(f.reduce(function(a,x){ return a+x.monto; },0))+'</b></div>'+
    '<button class="btn" onclick="confirmarImport()">Importar '+f.length+' movimientos</button>'+
    '<div id="impRes"></div>';
};
window.confirmarImport=function(){
  var filas=filasNormalizadas(), res=document.getElementById('impRes');
  res.innerHTML='<div class="nota">Importando…</div>';
  apiPost({ op:'importar', filas:filas }).then(function(r){
    if(!r||!r.ok) throw new Error((r&&r.error)||'error');
    res.innerHTML='<div class="ok">✅ '+r.importadas+' importados'+
      (r.duplicadas?' · '+r.duplicadas+' ya estaban':'')+
      (r.invalidas?' · '+r.invalidas+' con problemas':'')+'</div>';
    setTimeout(function(){ cerrarSheet(); irA('mes'); },1400);
  }).catch(function(e){
    res.innerHTML='<div class="err">No pude importar: '+esc(e.message)+'</div>';
  });
};

/* ============================ arranque ================================ */
function aplicarConfig(r){
  ST.cats=r.categorias||[]; ST.tipos=r.tipos||[]; ST.personas=r.personas||[];
  ST.medios=r.medios||[]; ST.planilla=r.planilla||'';
  store.set('g.cfg',JSON.stringify({cats:ST.cats,tipos:ST.tipos,personas:ST.personas,
    medios:ST.medios,planilla:ST.planilla}));
  pintarCats();
}
function cargarConfigRemota(avisar){
  return api({op:'config'}).then(function(r){
    if(r&&r.ok){ aplicarConfig(r); if(avisar) toast('Categorías actualizadas'); }
  }).catch(function(){});
}
window.cargarConfigRemota=cargarConfigRemota;

(function iniciar(){
  try{
    var c=JSON.parse(store.get('g.cfg')||'null');
    if(c){ ST.cats=c.cats||[]; ST.tipos=c.tipos||[]; ST.personas=c.personas||[];
           ST.medios=c.medios||[]; ST.planilla=c.planilla||''; }
  }catch(e){}
  if(!ST.medios.length) ST.medios=['Efectivo','Débito','Crédito','Transferencia','Mercado Pago','Otro'];
  if(!ST.cats.length){
    ST.cats=[{nombre:'Supermercados',emoji:'🛒'},{nombre:'Nafta',emoji:'⛽'},
      {nombre:'Cosas para la casa',emoji:'🛋️'},{nombre:'Otros',emoji:'📌'}];
  }
  pintarCats(); pintarChips(); pintarMonto(); pintarPendientes();

  if(!CFG.url||!CFG.key){ irA('mas'); toast('Configurá la conexión para empezar'); }
  else { cargarConfigRemota(); vaciarCola(); }

  if('serviceWorker' in navigator && location.protocol!=='file:'){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
})();
</script>
